name: Compose

# Keeps the local-testing stack (compose.yaml, dev/) from rotting: the file is
# valid for every profile, the WireMock mocks start healthy and answer every
# endpoint and scenario, and the real CLIs in the pinned workspace image
# complete an "agent edits a repo" loop against them.
#
# The workspace image is pulled from ghcr.io (public, pinned in compose.yaml);
# nothing here builds an image, and no secret is used.

on:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - dev/**
      - .shellcheckrc
      - .github/workflows/compose.yml
  pull_request:
    paths:
      - compose.yaml
      - dev/**
      - .shellcheckrc
      - .github/workflows/compose.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint the dev scripts
        run: shellcheck dev/*.sh

      - name: Validate compose.yaml (every profile)
        run: |
          docker compose config -q
          docker compose --profile build config -q
          docker compose --profile agent-canvas config -q
          docker compose --profile '*' config -q

      - name: Start the mocks
        run: docker compose up -d --wait mock-openai mock-anthropic

      - name: Probe the mocks
        run: sh dev/probe-mocks.sh

      - name: Try OpenCode in the workspace image
        run: docker compose run --rm -T workspace sh /dev-scripts/try-opencode.sh

      - name: Try Claude Code in the workspace image
        run: docker compose run --rm -T workspace sh /dev-scripts/try-claude.sh

      - name: Try Codex in the workspace image
        run: docker compose run --rm -T workspace sh /dev-scripts/try-codex.sh

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
