name: Build workspace image

# Builds ghcr.io/vymalo/another-agentic-images/workspace from workspace/Dockerfile:
# the agent-canvas toolchains (toolchains/install.sh, shared) on a bare
# debian:trixie-slim, without OpenHands Agent Canvas. Mirrors agent-canvas.yml.
# The build context is the repo root: the Dockerfile bind-mounts toolchains/.
#
# Runs on GitHub-hosted runners: nothing here should depend on the
# self-hosted fleet. A registry-backed buildx cache keeps warm rebuilds fast.
#
# Safety:
#   - Pull requests BUILD (including the Dockerfile's login-shell smoke test,
#     which is a RUN) but never PUSH. They export the image to a tarball only to
#     measure its size.
#   - Publishes only from `main` and `v*` tags.
#   - GITHUB_TOKEN reaches the build only as a BuildKit secret (cargo-binstall
#     rate limit); it is never baked into a layer.
#
# Tags: `<rust toolchain>-<sha7>` (immutable — pin THIS in deployments) and
# moving `latest`. The toolchain version is the RUST_TOOLCHAIN ARG (e.g.
# 1.98.1), the same convention family as agent-canvas's `<agent-canvas
# version>-<sha7>`: the version of the headline component, made unique by the
# commit. There is no moving `<rust toolchain>` tag: a Flutter or CLI bump
# would silently move it.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - workspace/**
      - toolchains/**
      - .dockerignore
      - tools/check-pins.sh
      - tools/image-size.sh
      - .github/workflows/workspace.yml
  pull_request:
    paths:
      - workspace/**
      - toolchains/**
      - .dockerignore
      - tools/check-pins.sh
      - tools/image-size.sh
      - .github/workflows/workspace.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vymalo/another-agentic-images/workspace
  # Reference for the size comparison (published, so measurable without a build).
  AGENT_CANVAS_IMAGE: ghcr.io/vymalo/another-agentic-images/agent-canvas:latest

concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check shared pins match agent-canvas
        run: sh tools/check-pins.sh

      - name: Free up disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Compute tags
        id: meta
        run: |
          version="$(sed -n 's/^ARG RUST_TOOLCHAIN=//p' workspace/Dockerfile)"
          test -n "$version"
          sha7="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          base="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "tags<<EOF"
            echo "${base}:${version}-${sha7}"
            echo "${base}:latest"
            echo "EOF"
            echo "cache=${base}:buildcache"
            echo "pinned=${base}:${version}-${sha7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: workspace/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          # Pull requests: no push, but export an OCI tarball to report the size.
          # compression=gzip is BuildKit's default; it is spelled out because the
          # measurement (tools/image-size.sh sums the layer blobs) is only
          # comparable to a registry pull when the layers are gzip, as in a push.
          outputs: ${{ github.event_name == 'pull_request' && format('type=oci,dest={0}/workspace.tar,compression=gzip', runner.temp) || '' }}
          provenance: false
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache }}
          cache-to: ${{ (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) && format('type=registry,ref={0},mode=max', steps.meta.outputs.cache) || '' }}

      - name: Report image size
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            src="${{ runner.temp }}/workspace.tar"
            what="built in this run (OCI tarball)"
          elif [ "${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}" = true ]; then
            src="${{ steps.meta.outputs.pinned }}"
            what="\`${src}\`"
          else
            echo "Nothing pushed or exported; no size to report."
            exit 0
          fi
          human() { numfmt --to=iec --suffix=B "$1"; }

          # Sizes are the sum of the compressed layer blobs (what a pull
          # downloads), in bytes, from tools/image-size.sh. --layers prints the
          # per-layer breakdown to this log.
          echo "::group::workspace layers: ${src}"
          ws="$(sh tools/image-size.sh --layers "$src")"
          echo "::endgroup::"
          echo "workspace:    ${ws} bytes ($(human "$ws"))"
          {
            echo "### Image size (compressed)"
            echo
            echo "| Image | Bytes | Size |"
            echo "|---|---|---|"
            echo "| workspace, ${what} | ${ws} | $(human "$ws") |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::group::agent-canvas layers: ${AGENT_CANVAS_IMAGE}"
          if ac="$(sh tools/image-size.sh --layers "${AGENT_CANVAS_IMAGE}")"; then
            echo "::endgroup::"
            delta=$((ac - ws))
            echo "agent-canvas: ${ac} bytes ($(human "$ac"))"
            if [ "$delta" -ge 0 ]; then
              echo "workspace is smaller by ${delta} bytes ($(human "$delta")); the target is 1000000000"
            else
              echo "workspace is LARGER by $((-delta)) bytes ($(human "$((-delta))"))"
            fi
            {
              echo "| agent-canvas, \`${AGENT_CANVAS_IMAGE}\` | ${ac} | $(human "$ac") |"
              echo "| **workspace is smaller by** | **${delta}** | **$(human "$delta")** |"
            } >> "$GITHUB_STEP_SUMMARY"
            # agent-canvas:latest moves when its own build publishes (the shared
            # script dropped its duplicated chown layer), so this reference can
            # shrink under an unchanged workspace.
            if [ "$delta" -lt 1000000000 ]; then
              echo "::warning::workspace is less than 1 GB smaller than agent-canvas (${delta} bytes; acceptance criterion of issue #6)"
            fi
          else
            echo "::endgroup::"
            echo "::warning::could not read the size of ${AGENT_CANVAS_IMAGE}"
          fi

      - name: Summary
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: echo "Published \`${{ steps.meta.outputs.pinned }}\`" >> "$GITHUB_STEP_SUMMARY"
