name: Build agent-canvas image

# Builds ghcr.io/vymalo/another-agentic-images/agent-canvas from agent-canvas/Dockerfile.
# The build context is the repo root: the Dockerfile bind-mounts toolchains/,
# the install script it shares with the workspace image (workspace.yml).
#
# Runs on GitHub-hosted runners: nothing here should depend on the
# self-hosted fleet. The image adds a multi-GB toolchain on top of the
# upstream Agent Canvas image, so disk is freed first; a registry-backed
# buildx cache keeps warm rebuilds fast.
#
# Safety:
#   - Pull requests BUILD (including the Dockerfile's login-shell smoke test)
#     but never PUSH.
#   - Publishes only from `main` and `v*` tags.
#   - GITHUB_TOKEN reaches the build only as a BuildKit secret (cargo-binstall
#     rate limit); it is never baked into a layer.
#
# Tags: `<agent-canvas version>-<sha7>` (immutable — pin THIS in deployments),
# plus moving `<agent-canvas version>` and `latest`.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - agent-canvas/**
      - toolchains/**
      - .dockerignore
      - tools/check-pins.sh
      - tools/image-size.sh
      - .github/workflows/agent-canvas.yml
  pull_request:
    paths:
      - agent-canvas/**
      - toolchains/**
      - .dockerignore
      - tools/check-pins.sh
      - tools/image-size.sh
      - .github/workflows/agent-canvas.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vymalo/another-agentic-images/agent-canvas

concurrency:
  group: agent-canvas-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build agent-canvas
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check shared pins match the workspace image
        run: sh tools/check-pins.sh

      - name: Free up disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Compute tags
        id: meta
        run: |
          version="$(sed -n 's/^ARG AGENT_CANVAS_VERSION=//p' agent-canvas/Dockerfile)"
          test -n "$version"
          sha7="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          base="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "tags<<EOF"
            echo "${base}:${version}-${sha7}"
            echo "${base}:${version}"
            echo "${base}:latest"
            echo "EOF"
            echo "cache=${base}:buildcache"
            echo "pinned=${base}:${version}-${sha7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent-canvas/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          provenance: false
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache }}
          cache-to: ${{ (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) && format('type=registry,ref={0},mode=max', steps.meta.outputs.cache) || '' }}

      - name: Summary
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          {
            echo "Published \`${{ steps.meta.outputs.pinned }}\`"
            echo
            echo "Compressed size (sum of layers): $(sh tools/image-size.sh "${{ steps.meta.outputs.pinned }}" | numfmt --to=iec --suffix=B)"
          } >> "$GITHUB_STEP_SUMMARY"
